[package]
name = "pulsetray"
version = "1.0.0"
description = "Lightweight system monitor for the Windows tray"
license = "MIT"
authors = ["PulseTray"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pulsetray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri-plugin-single-instance = "2.5.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Wdk_Graphics_Direct3D", "Wdk_Foundation", "Wdk_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications"] }
wmi = { version = "0.18.4", default-features = false }
ureq = { version = "3", features = ["json"] }
sha2 = "0.11.0"
url = "2.5.8"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
tauri-plugin-global-shortcut = "2"
# Same version tauri's wry uses; only to name the WebView2 interface that trims memory while the popup is hidden.
webview2-com = "0.39"
# App icons in the "Top apps" list (both already come with tauri).
png = "0.17"
# Battery history: reads Windows' own battery report (powercfg /batteryreport /xml).
quick-xml = "0.42"
base64 = "0.22"

# Notifications on macOS / Linux (toast.rs). On Windows the toasts go through WinRT and this crate is not even built.
[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

